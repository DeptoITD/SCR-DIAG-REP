# =============================================================================
# /etc/samba/smb.conf
# Configuración limpia - Un solo share 02_Proyectos con ACLs POSIX
# Los permisos por especialidad/proyecto se manejan via ACLs en el filesystem
# =============================================================================

[global]
   # --- Identificación ---
   workgroup = WORKGROUP
   server string = Servidor Indesco
   netbios name = SRV-INDESCO
   server role = standalone server

   # --- Seguridad ---
   security = user
   map to guest = never
   passdb backend = tdbsam
   obey pam restrictions = yes
   unix password sync = no

   # --- ACLs (crítico para que funcionen los permisos por carpeta) ---
   vfs objects = acl_xattr
   map acl inherit = yes
   store dos attributes = yes
   inherit acls = yes
   inherit permissions = yes
   acl allow execute always = yes

   # --- Visibilidad (oculta lo que no puedes leer) ---
   hide unreadable = yes
   access based share enum = yes

   # --- Compatibilidad Windows ---
   unix extensions = no
   smb encrypt = auto
   server min protocol = SMB2

   # --- Rendimiento ---
   socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=131072 SO_SNDBUF=131072
   read raw = yes
   write raw = yes
   use sendfile = yes

   # --- Logs ---
   log file = /var/log/samba/log.%m
   max log size = 1000
   log level = 1

   # --- Resolución de nombres ---
   name resolve order = bcast host
   wins support = yes
   local master = yes
   preferred master = yes
   os level = 255

   # --- Máscaras por defecto ---
   create mask = 0770
   directory mask = 2770
   force create mode = 0660
   force directory mode = 2770


# =============================================================================
# SHARE PRINCIPAL - Todo el árbol de proyectos en una sola carpeta
# Los permisos internos los controlan las ACLs POSIX del filesystem
# =============================================================================

[02_Proyectos]
   path = /srv/samba/02_Proyectos
   browseable = yes
   writable = yes
   read only = no
   guest ok = no

   # Todos los grupos IND_* tienen acceso al share
   # Las ACLs del filesystem controlan qué pueden ver/editar dentro
   valid users = soporte @IND_PMO @IND_ARQ @IND_BIM @IND_GEO @IND_EST @IND_ITD

   # ACLs heredadas
   inherit acls = yes
   inherit permissions = yes
   map acl inherit = yes

   # Ocultar lo que no se puede leer
   hide unreadable = yes
   access based share enum = yes

   # Sin extensiones Unix para compatibilidad Windows
   unix extensions = no
